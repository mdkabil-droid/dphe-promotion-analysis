const RM={d:'ড্রাফটসম্যান পদে পদোন্নতিপ্রাপ্ত',p:'উন্নয়ন প্রকল্প হতে রাজস্ব বাজেটে স্থানান্তরিত পদের পদধারীদের নিয়মিতকরণ ও জ্যেষ্ঠতা বিধিমালা-২০০৫ অনুসরণ করা হয়েছে',a:'প্রকল্প হতে রাজস্ব বাজেটে আত্তীকৃত'};
const fmtS=t=>new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).replace(',','');
function dur(a,b){let m=Math.round((b-a)/MS/30.4375),y=Math.floor(m/12);m%=12;return (y?n2(y)+' বছর ':'')+(m||!y?n2(m)+' মাস':'')}
const prlOf=(d,age)=>{const x=new Date(d);return Date.UTC(x.getUTCFullYear()+age,x.getUTCMonth(),x.getUTCDate())};
function sim(){
 const posts=+$('posts').value||79,age=+$('age').value||59,today=Date.parse($('today').value);
 const proIn=$('pro').value.trim(),pro=proIn===''||isNaN(+proIn)?0:Math.max(0,Math.floor(+proIn));
 P.forEach(p=>{p.prl=prlOf(p.dob,age);p.st=p.other?'other':null;p.pd=null;p.via=null});
 const serving=O.map(o=>({name:o.name,prl:prlOf(o.dob,age)})).filter(o=>o.prl>today);
 const cand=P.filter(p=>!p.other);
 const done=cand.slice(0,pro);done.forEach(x=>{x.st='done'});
 const dsv=done.filter(x=>x.prl>today);
 let ci=done.length,free=posts-serving.length-dsv.length,vac0=Math.max(0,free);
 let ev=serving.map(p=>({t:p.prl,p})).concat(dsv.map(p=>({t:p.prl,p}))).sort((a,b)=>a.t-b.t);
 const take=(t,via)=>{while(free>0){let c=null;while(ci<cand.length){const x=cand[ci++];if(x.prl>t){c=x;break}x.st='never'}
   if(!c)return;c.st=t<=today?'now':'soon';c.pd=t;c.via=via;free--;ev.push({t:c.prl,p:c});ev.sort((a,b)=>a.t-b.t)}};
 take(today,null);
 while(ev.length){const e=ev.shift();free++;take(e.t,e.p)}
 while(ci<cand.length)cand[ci++].st='never';
 R={posts,age,today,serving:serving.length+dsv.length,vac:vac0,pro:done.length};
}
const badge={done:['dn','পদোন্নতি পেয়েছেন'],now:['ok','এখনই'],soon:['wt','সম্ভাব্য পদোন্নতির তারিখ'],never:['bad','পদোন্নতি হবে না'],other:['rt','অন্য পদে']};
function info(p){
 let h='';const kv=(a,b)=>h+=`<div class="kv"><span>${a}</span><span>${b}</span></div>`;
 if(p.st==='soon'||p.st==='now'){const now=p.st==='now';
  h=`<div class="big"><small>আনুমানিক পদোন্নতির তারিখ</small><b>${now?'এখনই (পদ শূন্য আছে)':fmtD(p.pd)}</b>${now?'':`<small>প্রায় ${dur(R.today,p.pd)} পরে</small>`}</div>`;
  kv('যার অবসরে',p.via?(p.via.no?`<span>${p.via.name} (ক্রমিক ${n2(p.via.no)})</span>`:`<span style="text-transform:capitalize">${p.via.name}</span>`):'বর্তমান শূন্য পদে');}
 else if(p.st==='done')h=`<div class="big"><small>অবস্থা</small><b>পদোন্নতি পেয়েছেন</b><small>বর্তমানে পদোন্নতিপ্রাপ্ত হিসেবে কর্মরত</small></div>`;
 else if(p.st==='other')h=`<div class="big"><small>অবস্থা</small><b>ড্রাফটসম্যান পদে পদোন্নতিপ্রাপ্ত</b></div>`;
 else h=`<div class="big"><small>অবস্থা</small><b>পদোন্নতির আগেই অবসর</b><small>${p.prl<=R.today?'ইতিমধ্যে অবসরের বয়সে পৌঁছেছেন':'পালা আসার আগেই অবসরে যাবেন'}</small></div>`;
 kv('ক্রমিক নং',n2(p.no));{const bt=batchOf(p.no);if(bt)kv('ব্যাচ',bShort(bt)+' <span class="mu">(যোগদান: '+bd(joinOf(p.no))+')</span>')}kv('জন্মতারিখ',fmtD(p.dob));kv(p.prl<=R.today?'অবসরের তারিখ (গত)':'অবসর (পিআরএল) তারিখ',fmtD(p.prl));
 const r=REM[p.no];kv('মন্তব্য',r?RM[r]:'পিএসসি');
 return h}
function render(){
 const q=$('q').value.trim().toLowerCase().replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c));
 const L=P.filter(p=>(filt==='all'||p.st===filt||(filt==='soon'&&p.st==='now'))&&(!bsel||String(batchOf(p.no))===bsel)&&(!q||p.name.toLowerCase().includes(q)||String(p.no)===q));
 $('list').innerHTML=L.length?L.map(p=>`<div class="it"><button class="hd" data-n="${p.no}"><span class="no">${n2(p.no)}</span><span class="nm">${p.name}${batchOf(p.no)?` <small class="mu">· ব্যাচ ${bShort(batchOf(p.no))}</small>`:''}</span><span class="bd ${badge[p.st][0]}">${p.st==='soon'?fmtS(p.pd):badge[p.st][1]}</span></button>${open.has(p.no)?`<div class="dt">${info(p)}</div>`:''}</div>`).join(''):'<div class="emp">কাউকে পাওয়া যায়নি</div>';
}
function all(){sim();$('s1').textContent=n2(R.serving);$('s2').textContent=n2(R.vac);$('s3').textContent=n2(R.pro);$('s4').textContent=n2(P.length);
 const C=[['all','সবাই'],['done','পদোন্নতি পেয়েছেন'],['now','এখনই'],['soon','সম্ভাব্য পদোন্নতির তারিখ'],['never','পদোন্নতি হবে না'],['other','অন্য পদে']];
 {const cnt={};P.forEach(p=>{const y=batchOf(p.no);cnt[y]=(cnt[y]||0)+1});
  $('bf').innerHTML='<option value="">সব ব্যাচ</option>'+Object.keys(cnt).sort((a,b)=>a-b).map(y=>`<option value="${y}"${bsel===y?' selected':''}>ব্যাচ ${bShort(y)} (${n2(cnt[y])})</option>`).join('')}
 $('chips').innerHTML=C.map(c=>`<button class="chip${filt===c[0]?' on':''}" data-f="${c[0]}">${c[1]}</button>`).join('');render()}
$('list').onclick=e=>{const b=e.target.closest('.hd');if(!b)return;const n=+b.dataset.n;open.has(n)?open.delete(n):open.add(n);render()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){filt=b.dataset.f;all()}};
$('q').oninput=render;$('bf').onchange=()=>{bsel=$('bf').value;render()};['posts','age','today','pro'].forEach(i=>$(i).onchange=all);
all();
</script></body></html>
